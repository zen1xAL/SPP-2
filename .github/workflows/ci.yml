name: CI Automated Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  typecheck-and-lint:
    name: TypeScript Strict Typecheck & Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            lab1/package-lock.json
            lab2/package-lock.json
            lab3/package-lock.json

      - name: Verify Lab 1 Typecheck
        run: |
          cd lab1
          npm ci
          npm run typecheck

      - name: Verify Lab 2 Typecheck
        run: |
          cd lab2
          npm ci
          npm run typecheck

      - name: Verify Lab 3 Typecheck
        run: |
          cd lab3
          npm ci
          npm run typecheck

  automated-tests:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Lab 1 Tests
        run: |
          cd lab1
          npm ci
          npm test

      - name: Run Lab 3 Tests
        run: |
          cd lab3
          npm ci
          npm test

  docker-build:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Lab 3 Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./lab3
          push: false
          tags: taskflow-lab3:test
